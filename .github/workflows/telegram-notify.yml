name: Telegram Release Notification

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: info
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # 提取当前版本的 changelog 内容，去除空行，最多 30 行
          BODY=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{if(flag) exit} flag" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            | head -30)
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send to Telegram Group
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_GROUP_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🎉 *BEpusdt Python SDK ${{ github.ref_name }} 发布！*

            📝 更新内容:
            ${{ steps.info.outputs.BODY }}

            🔗 [查看详情](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            💻 安装命令:
            ```
            pip install --upgrade bepusdt
            ```

            📚 https://github.com/${{ github.repository }}

      - name: Send to Telegram Channel
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🎉 *BEpusdt Python SDK ${{ github.ref_name }} 发布！*

            📝 更新内容:
            ${{ steps.info.outputs.BODY }}

            🔗 [查看详情](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})

            💻 安装命令:
            ```
            pip install --upgrade bepusdt
            ```

            📚 https://github.com/${{ github.repository }}
